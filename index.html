<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>مخزن الترقيمات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f9;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e5eaf3;--brand:#4f46e5;--good:#059669;--bad:#e11d48;--warn:#d97706;--r:18px;--shadow:0 1px 2px rgba(15,23,42,.05),0 10px 28px -10px rgba(15,23,42,.14)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;color:var(--ink);line-height:1.6;min-height:100vh;
background:radial-gradient(1100px 480px at 100% -8%,#dfe7ff 0,transparent 60%),radial-gradient(900px 420px at 0% 0%,#d6f4ee 0,transparent 55%),var(--bg)}
button,input,select,textarea{font-family:inherit;font-size:15px}
button{cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}

/* header */
header.top{background:linear-gradient(120deg,#312e81 0%,#4f46e5 48%,#0891b2 100%);color:#fff;padding:16px 0 70px;position:relative;overflow:hidden}
header.top::after{content:"";position:absolute;inset:auto -80px -120px auto;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,.08)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:15px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:25px;backdrop-filter:blur(4px)}
.brand h1{margin:0;font-size:22px;font-weight:800;line-height:1.2}
.brand p{margin:0;font-size:13px;opacity:.85}
.who{display:flex;align-items:center;gap:8px}
.chip-user{background:rgba(255,255,255,.18);padding:6px 14px;border-radius:99px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:700;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 6px 16px -6px rgba(79,70,229,.7)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.light{background:#eef0ff;color:#3730a3}
.btn.light:hover{background:#e0e4ff}
.btn.ghost{background:rgba(255,255,255,.18);color:#fff}
.btn.ghost:hover{background:rgba(255,255,255,.28)}
.btn.danger{background:#fff1f2;color:#be123c}
.btn.danger:hover{background:#ffe4e6}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.green{background:#059669;color:#fff}

/* tabs */
.tabs-wrap{margin-top:-46px;position:relative;z-index:2}
.tabs{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:6px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:0;background:transparent;padding:10px 16px;border-radius:13px;font-weight:700;color:#475569;white-space:nowrap;display:flex;align-items:center;gap:8px;justify-content:center}
.tab:hover{background:#f1f5f9}
.tab .dot{width:10px;height:10px;border-radius:50%;background:var(--c,#94a3b8)}
.tab.on{background:var(--c,var(--brand));color:#fff;box-shadow:0 8px 18px -8px var(--c,var(--brand))}
.tab.on .dot{background:#fff}
.tab .pen{font-size:12px;opacity:.9}

main{padding:24px 14px 40px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card h3{margin:0 0 12px;font-size:17px;font-weight:800}
.grid{display:grid;gap:14px}
.sec{margin-top:16px}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.sec-title h3{margin:0}
.muted{color:var(--muted);font-size:13px}

/* KPI */
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--k,#4f46e5);border-radius:0 5px 5px 0;left:auto;right:0}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:25px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--k,#0f172a);line-height:1.3;margin-top:2px}
.kpi.big{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff}
.kpi.big .l{color:rgba(255,255,255,.85)}.kpi.big .v{color:#fff}.kpi.big::before{display:none}

/* machine cards */
.mcards{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.mcard{all:unset;box-sizing:border-box;display:block;cursor:pointer;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:16px;position:relative;overflow:hidden;transition:.18s;border-top:5px solid var(--mc)}
.mcard:hover{transform:translateY(-3px);box-shadow:0 18px 34px -14px rgba(15,23,42,.28)}
.mcard:focus-visible{outline:3px solid var(--mc)}
.mc-top{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.mc-top .dot{width:12px;height:12px;border-radius:50%;background:var(--mc)}
.chip{margin-inline-start:auto;background:#f1f5f9;color:#475569;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700}
.mc-big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--mc);margin:6px 0 0;line-height:1.2}
.mc-big small{font-size:13px;color:var(--muted);font-weight:600;margin-inline-start:4px}
.mc-row{display:flex;gap:14px;font-size:14px;font-weight:700;margin:6px 0 8px}
.g{color:var(--good)}.b{color:var(--bad)}
.bar{height:8px;border-radius:99px;background:#d1fae5;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#fb7185,#e11d48);border-radius:99px}
.mc-foot{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}

/* charts */
.two{grid-template-columns:1fr}
@media(min-width:960px){.two{grid-template-columns:1fr 1fr}}
.chart{width:100%;height:auto;direction:ltr;display:block}
.chart .grid{stroke:#e5eaf3;stroke-width:1}
.chart .ax{font-size:11px;fill:#64748b}
.chart .vl{font-size:11px;fill:#334155;font-weight:700}
.chart .lb{font-size:13px;fill:#0f172a;font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 6px;font-size:13px;font-weight:600;color:#334155}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.seg{display:inline-flex;background:#f1f5f9;border-radius:11px;padding:3px}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:9px;font-weight:700;font-size:13px;color:#475569}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.empty{padding:34px 12px;text-align:center;color:var(--muted);background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 10px,#f1f5f9 10px,#f1f5f9 20px);border-radius:14px;font-weight:600}
.cat{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.cat:last-child{border:0}
.cat .nm{font-weight:700;font-size:14px}
.cat .tr{height:16px;border-radius:99px;background:#f1f5f9;display:flex;overflow:hidden;direction:ltr}
.cat .tr i{display:block;height:100%}
.cat .nv{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;text-align:end}

/* machine view */
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.mhead h2{margin:0;font-size:24px;font-weight:800;color:var(--mc)}
.mhead p{margin:0;color:var(--muted);font-size:13px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.tile{background:#fff;border-radius:15px;padding:12px 14px;box-shadow:var(--shadow);border-bottom:4px solid var(--t,#cbd5e1)}
.tile .l{font-size:12.5px;color:var(--muted);font-weight:700}
.tile .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--t,var(--ink))}
.tile.hl{background:var(--mc);color:#fff;border-color:rgba(0,0,0,.18)}
.tile.hl .l{color:rgba(255,255,255,.85)}.tile.hl .v{color:#fff}

.formcard{border-top:5px solid var(--mc)}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){.fgrid{grid-template-columns:repeat(4,1fr)}}
.fgrid .span2{grid-column:span 2}
.fgrid .span4{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:13.5px;color:#334155}
input[type=text],input[type=date],input[type=password],select,textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#f8fafc;color:var(--ink);transition:.15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--mc,var(--brand));background:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--mc,#4f46e5) 18%,transparent)}
input.num{text-align:center;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
label.f.gd input{border-color:#a7f3d0;background:#ecfdf5}
label.f.bd input{border-color:#fecdd3;background:#fff1f2}
label.f.dl input{border-color:#fde68a;background:#fffbeb}
label.f.gd{color:#047857}label.f.bd{color:#be123c}label.f.dl{color:#b45309}
.preview{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.pv{background:#f8fafc;border-radius:13px;padding:10px 12px;border:1px solid var(--line)}
.pv .l{font-size:12px;color:var(--muted);font-weight:700}
.pv .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.pv .s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pv.neg{background:#fff1f2;border-color:#fda4af}.pv.neg .v{color:var(--bad)}
.formula{font-size:12.5px;color:var(--muted);background:#f8fafc;border-radius:10px;padding:8px 12px;margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.lock{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fffbeb;border:1px solid #fde68a}
.lock .ic{font-size:30px}

.ocards{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.oc{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:14px;border-inline-start:6px solid var(--mc)}
.oc-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.oc-h b{font-size:18px;font-weight:800;direction:ltr}
.badge{background:color-mix(in srgb,var(--mc) 14%,#fff);color:var(--mc);padding:2px 12px;border-radius:99px;font-weight:800;font-size:13px}
.oc-n{font-size:13px;color:#475569;margin:6px 0 0;background:#f8fafc;border-radius:9px;padding:6px 10px;word-break:break-word}
.oc-s{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.oc-s div{text-align:center;border-radius:11px;padding:6px 2px}
.oc-s .l{font-size:11.5px;font-weight:700}
.oc-s .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.oc-s .a{background:#ecfdf5;color:#047857}.oc-s .c{background:#fff1f2;color:#be123c}.oc-s .d{background:#eef2ff;color:#3730a3}
.oc-f{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
.qbar{height:7px;border-radius:99px;background:#e2e8f0;overflow:hidden;margin:2px 0 5px}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mc),color-mix(in srgb,var(--mc) 55%,#fff));border-radius:99px}
.oc-b{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

.tw{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:820px;background:#fff}
th{background:#f1f5f9;padding:9px 10px;text-align:center;font-weight:800;color:#334155;white-space:nowrap;position:sticky;top:0}
td{padding:8px 10px;text-align:center;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
td.l{text-align:start;white-space:normal;min-width:130px}
tr:hover td{background:#fafbff}
td small{display:block;color:var(--muted);font-size:11.5px}
.ltr{direction:ltr;unicode-bidi:embed}

/* modal / toast */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50;animation:fade .15s}
.modal{background:#fff;border-radius:22px;width:100%;max-width:460px;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);animation:pop .18s}
.modal h3{margin:0 0 14px;font-size:19px;font-weight:800}
.modal .fgrid{grid-template-columns:1fr 1fr}
.modal .fgrid .span2{grid-column:1/-1}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:#0f172a;color:#fff;padding:11px 22px;border-radius:14px;font-weight:700;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;text-align:center;box-shadow:0 14px 30px -10px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:#be123c}
#toast.ok{background:#047857}
.err-txt{color:#be123c;font-weight:700;font-size:13px;margin-top:8px;min-height:20px}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:0 14px 26px}
.acc{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.acc .nm{font-weight:800}
@media(max-width:560px){.acc{grid-template-columns:1fr 1fr}.acc .nm{grid-column:1/-1}.brand h1{font-size:19px}.cat{grid-template-columns:90px 1fr}.cat .nv{grid-column:1/-1;text-align:start}}
.modal.wide{max-width:1000px}
.badge.st-new{background:#d1fae5;color:#047857}.badge.st-upd{background:#e0e7ff;color:#3730a3}.badge.st-same{background:#f1f5f9;color:#475569}.badge.st-err{background:#ffe4e6;color:#be123c}
.wn{font-size:12px;color:#b45309;font-weight:600;margin-top:3px;white-space:normal}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tw input[type=checkbox]{width:18px;height:18px}
@media print{header .who,.tabs-wrap,.actions,.oc-b,footer{display:none!important}}
.alerts{display:grid;gap:8px}
.al{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:13px;font-weight:600;font-size:14px;line-height:1.7;border:1px solid}
.al .ic{font-size:18px;line-height:1.5}
.al.hi{background:#fff1f2;border-color:#fecdd3;color:#9f1239}
.al.md{background:#fffbeb;border-color:#fde68a;color:#92400e}
.al.lo{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}
.fc{font-size:12.5px;color:#475569;background:#f8fafc;border-radius:9px;padding:5px 10px;margin:0 0 6px}
.fc b{color:var(--ink)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:0 0 12px}
.filters label.f{font-size:12.5px}
#toast.act{pointer-events:auto}
#toast .ub{margin-inline-start:10px;background:#fff;color:#0f172a;border:0;border-radius:9px;padding:3px 12px;font-weight:800}
tr.tot td{background:#eef2ff;font-weight:800}
body.pr header.top,body.pr .tabs-wrap,body.pr main,body.pr footer,body.pr .noprint,body.pr #toast{display:none!important}
body.pr .overlay{position:static;background:#fff;padding:0;display:block;backdrop-filter:none;animation:none}
body.pr .modal{box-shadow:none;max-width:none;max-height:none;overflow:visible;padding:0;animation:none}
</style>
</head>
<body>

<header class="top">
 <div class="wrap top-in">
  <div class="brand">
   <div class="logo">📦</div>
   <div><h1>مخزن الترقيمات</h1><p>متابعة إنتاج وتسليمات وأرصدة مخازن الماكينات</p></div>
  </div>
  <div class="who" id="who"></div>
 </div>
</header>

<div class="wrap tabs-wrap"><nav class="tabs" id="tabs"></nav></div>
<main class="wrap" id="view"></main>
<footer id="foot">البيانات محفوظة داخل هذا المتصفح على هذا الجهاز · استخدم «النسخ الاحتياطي» من صفحة الإدارة بشكل دوري</footer>

<div id="modal-root"></div>
<div id="toast"></div>
<input type="file" id="file-in" accept=".json,application/json" hidden>
<input type="file" id="xl-in" accept=".xlsx,.xlsm,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>

<script>
"use strict";
/* ============== ثوابت ============== */
const LS_KEY='tarqeem_stock_v1', SS_KEY='tarqeem_session_v1';
const MACHINES=[1,2,3,4];
const AR_NUM=['','١','٢','٣','٤'];
const MNAME=m=>'ترقيم '+AR_NUM[m];
const MCOL={1:'#0d9488',2:'#4f46e5',3:'#d97706',4:'#db2777'};
const MAXQ=1200000;                       /* أقصى كمية للأمر الواحد (فرخ) */
const qtyOf=o=>Math.min(MAXQ,Number(o.qty)||MAXQ);
/* حدود التنبيهات الذكية */
const DEFECT_WARN=20, NEAR_DONE=0.9, IDLE_DAYS=14;

/* ============== إعدادات Firebase ==============
   الصق هنا إعدادات مشروعك من: Firebase Console ← Project settings ← Your apps ← Web app ← firebaseConfig
   لو تركتها فاضية يشتغل البرنامج محلياً على الجهاز فقط (بدون مزامنة). */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBgEAZf5wDXbiZyriTHPkI8qYyYx2b-XrY",
  authDomain: "trakem.firebaseapp.com",
  databaseURL: "https://trakem-default-rtdb.firebaseio.com",
  projectId: "trakem",
  storageBucket: "trakem.firebasestorage.app",
  messagingSenderId: "1087035146902",
  appId: "1:1087035146902:web:50f2f1aa2a5fb1bc8378b7"
};
const ACCOUNT_DOMAIN = 'tarqeem.app';     /* اسم المستخدم machine1 ⇐ البريد machine1@tarqeem.app */
const FB_VERSION = '10.12.5';
const CLOUD = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.databaseURL);
let FB=null, CLOUD_READY=false, CLOUD_ERR='', ONLINE=false, NAV_AFTER=false, RAF=0;

/* ============== أدوات ============== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-US');
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>ymd(new Date());
const fmtDate=s=>{const p=String(s).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s};
const fmtTime=iso=>{try{const d=new Date(iso);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())}catch(e){return ''}};
const normDigits=s=>String(s==null?'':s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
/* يقبل أرقام عربية وإنجليزية وفواصل — يرجع NaN لو القيمة غير صالحة */
function parseNum(v){
  const s=normDigits(v).replace(/[,،٬\s]/g,'');
  if(s==='')return 0;
  return /^\d+$/.test(s)?Number(s):NaN;
}
function compact(n){
  n=Math.round(n);
  if(n>=1e6)return (n/1e6).toFixed(2).replace(/\.?0+$/,'')+'M';
  if(n>=1e3)return (n/1e3).toFixed(1).replace(/\.?0+$/,'')+'K';
  return String(n);
}
function niceMax(v){
  if(v<=0)return 1;
  const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;
  return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;
}

async function initCloud(){
  try{
    const base='https://www.gstatic.com/firebasejs/'+FB_VERSION+'/';
    const [A,D,U]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-database.js'),import(base+'firebase-auth.js')]);
    const app=A.initializeApp(FIREBASE_CONFIG);
    /* تخزين الدخول بترتيب احتياطي: لو المتصفح/المعاينة بتمنع التخزين ينزل للذاكرة بدل ما يتعلق */
    let authInst;
    try{authInst=U.initializeAuth(app,{persistence:[U.indexedDBLocalPersistence,U.browserLocalPersistence,U.inMemoryPersistence]})}
    catch(e){authInst=U.getAuth(app)}
    FB={db:D.getDatabase(app),auth:authInst,ref:D.ref,set:D.set,update:D.update,remove:D.remove,
        signInWithEmailAndPassword:U.signInWithEmailAndPassword,signOut:U.signOut,
        onValue:D.onValue,query:D.query,limitToLast:D.limitToLast};
    let gotO=false,gotE=false;

    const lerr=e=>{CLOUD_ERR=String((e&&e.code)||(e&&e.message)||e);render(true)};
    D.onValue(D.ref(FB.db,'orders'),s=>{DB.orders=toArr(s);gotO=true;ready();sched()},lerr);

const ordersOf=m=>DB.orders.filter(o=>o.machine===m);
/* فهرس الحركات حسب الأمر: يُعاد بناؤه فقط لما تتغير مصفوفة الحركات أو عددها، فالحساب يبقى سريع مهما كبرت البيانات */
let _ix={e:null,n:-1,map:null};
function entsOf(id){
  const E=DB.entries;
  if(_ix.e!==E||_ix.n!==E.length){
    const m=new Map();
    for(const x of E){let a=m.get(x.order);if(!a)m.set(x.order,a=[]);a.push(x)}
    _ix={e:E,n:E.length,map:m};
  }
  return _ix.map.get(id)||[];
}
function totals(o,list){
  let pg=o.og||0,pb=o.ob||0,dg=0,db=0;
  const src=list===DB.entries?entsOf(o.id):list;
  for(const e of src){ if(e.order!==o.id)continue; pg+=e.g||0;pb+=e.b||0;dg+=e.dg||0;db+=e.db||0 }
  return {pg,pb,dg,db,sg:pg-dg,sb:pb-db,prod:pg+pb,del:dg+db,stock:(pg-dg)+(pb-db)};
}
function mTotals(m,list){
  list=list||DB.entries;
  const t={pg:0,pb:0,dg:0,db:0,sg:0,sb:0,prod:0,del:0,stock:0};
  for(const o of ordersOf(m)){const x=totals(o,list);for(const k in t)t[k]+=x[k]}
  return t;
}
function orderMachineMap(){const m={};DB.orders.forEach(o=>m[o.id]=o.machine);return m}
/* ترتيب زمني (تاريخ ثم وقت الإدخال) بمقارنة مباشرة — أسرع بكثير من localeCompare على آلاف الحركات */
const cmpDT=(a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts<b.ts?-1:a.ts>b.ts?1:0);
function runningBalances(o){
  const list=[...entsOf(o.id)].sort(cmpDT);
  let sg=o.og||0,sb=o.ob||0;const map={};
  for(const e of list){sg+=(e.g||0)-(e.dg||0);sb+=(e.b||0)-(e.db||0);map[e.id]={sg,sb}}
  return map;
}
/* metric: prod = إنتاج (سليم+معيب) · def = معيب · del = تسليمات */
function dailySeries(days,metric){
  const OM=orderMachineMap(),labels=[],keys=[],now=new Date();
  for(let i=days-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);keys.push(ymd(d));labels.push(pad(d.getDate())+'/'+pad(d.getMonth()+1))}
  const idx={};keys.forEach((k,i)=>idx[k]=i);
  const series=MACHINES.map(m=>({name:MNAME(m),color:MCOL[m],values:keys.map(()=>0)}));
  for(const e of DB.entries){
    const i=idx[e.date],m=OM[e.order];
    if(i!=null&&m)series[m-1].values[i]+=metric==='def'?(e.b||0):metric==='del'?(e.dg||0)+(e.db||0):(e.g||0)+(e.b||0);
  }
  return {labels,series};
}

async function doLogin(){
  const u=$('#l-u').value.trim().toLowerCase(),p=$('#l-p').value;
  if(CLOUD){
    if(!FB){$('#l-err').textContent='لم يتم الاتصال بالسحابة بعد — انتظر لحظة وحاول مرة أخرى';return}
    if(!u||!p){$('#l-err').textContent='اكتب اسم المستخدم وكلمة المرور';return}
    $('#l-err').textContent='جاري الدخول…';
    try{
      NAV_AFTER=true;
      const tmo=new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),15000));
      await Promise.race([FB.signInWithEmailAndPassword(FB.auth,u.includes('@')?u:u+'@'+ACCOUNT_DOMAIN,p),tmo]);
      closeModal();
    }catch(e){
      NAV_AFTER=false;
      const c=String(e&&e.code||'');
      const el=$('#l-err');if(!el)return;
      el.textContent=
        /invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c)?'اسم المستخدم أو كلمة المرور غير صحيحة (كلمة المرور في Firebase 6 خانات على الأقل)':
        c==='timeout'?'خدمة الدخول لا ترد. افتح البرنامج من متصفح عادي (Chrome أو Safari) عبر رابط الاستضافة وليس من معاينة الملف، وتأكد من الإنترنت':
        c==='auth/operation-not-allowed'?'تسجيل الدخول بالبريد غير مفعّل: Firebase ← Authentication ← Sign-in method ← Email/Password ← Enable':
        c==='auth/unauthorized-domain'?'هذا الدومين غير مصرّح: Firebase ← Authentication ← Settings ← Authorized domains ← أضف دومين الصفحة':
        c==='auth/network-request-failed'?'تعذر الاتصال بالإنترنت أو الخدمة محجوبة':
        'تعذر الدخول ('+(c||'خطأ')+')';
    }
    return;
  }
  for(const k of Object.keys(DB.users)){
    const a=DB.users[k];
    if(a.user.toLowerCase()===u&&a.pass===p){
      setSession({role:k==='admin'?'admin':Number(k)});
      closeModal();
      if(k!=='admin')VIEW=Number(k);
      render();toast('أهلاً '+whoName(),'ok');return;
    }
  }
  $('#l-err').textContent='اسم المستخدم أو كلمة المرور غير صحيحة';
}

/* ---------- رسوم بيانية SVG ---------- */
function barChartSVG(labels,series){
  const W=680,H=330,L=50,R=12,T=26,B=42,iw=W-L-R,ih=H-T-B;
  const raw=Math.max(0,...series.flatMap(s=>s.values)),max=niceMax(raw||1);
  let s='<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="مقارنة الماكينات">';
  for(let i=0;i<=4;i++){
    const y=T+ih-ih*i/4;
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" class="grid"/><text x="'+(L-7)+'" y="'+(y+4)+'" class="ax" text-anchor="end">'+compact(max*i/4)+'</text>';
  }
  const gw=iw/labels.length,n=series.length,bw=Math.min(38,gw*0.78/n),gap=3;
  labels.forEach((lb,i)=>{
    const cx=L+gw*(i+.5),total=n*bw+(n-1)*gap;
    series.forEach((se,j)=>{
      const v=se.values[i],h=Math.max(0,ih*v/max),x=cx-total/2+j*(bw+gap),y=T+ih-h;
      s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="5" fill="'+se.color+'"><title>'+esc(lb)+' — '+esc(se.name)+': '+fmt(v)+'</title></rect>';
      if(v>0)s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-5).toFixed(1)+'" class="vl" text-anchor="middle">'+compact(v)+'</text>';
    });
    s+='<text x="'+cx.toFixed(1)+'" y="'+(H-15)+'" class="lb" text-anchor="middle">'+esc(lb)+'</text>';
  });
  return s+'</svg>';
}
function lineChartSVG(labels,series){
  const W=680,H=300,L=50,R=18,T=16,B=38,iw=W-L-R,ih=H-T-B,N=labels.length;
  const raw=Math.max(0,...series.flatMap(s=>s.values)),max=niceMax(raw||1);
  const X=i=>N===1?L+iw/2:L+iw*i/(N-1),Y=v=>T+ih-ih*v/max;
  let s='<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="الإنتاج اليومي">';
  for(let i=0;i<=4;i++){
    const y=T+ih-ih*i/4;
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" class="grid"/><text x="'+(L-7)+'" y="'+(y+4)+'" class="ax" text-anchor="end">'+compact(max*i/4)+'</text>';
  }
  const step=N>20?5:N>10?2:1;
  labels.forEach((lb,i)=>{ if(i%step===0||i===N-1)s+='<text x="'+X(i).toFixed(1)+'" y="'+(H-14)+'" class="ax" text-anchor="middle">'+lb+'</text>' });
  series.forEach(se=>{
    if(!se.values.some(v=>v>0))return;
    const d=se.values.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
    s+='<path d="'+d+'" fill="none" stroke="'+se.color+'" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>';
    se.values.forEach((v,i)=>{
      if(N<=16)s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="3.6" fill="#fff" stroke="'+se.color+'" stroke-width="2.4"/>';
      s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="11" fill="transparent"><title>'+esc(se.name)+' — '+labels[i]+': '+fmt(v)+'</title></circle>';
    });
  });
  return s+'</svg>';
}

/* ============== العمليات: الحركات ============== */
const entSum=e=>'سليم '+fmt(e.g)+' / معيب '+fmt(e.b)+' / تسليم '+fmt((e.dg||0)+(e.db||0));
function saveEntry(m,force){
  const err=t=>{const el=$('#f-err');if(el)el.textContent=t;return false};
  const o=DB.orders.find(x=>x.id===$('#f-order').value);
  if(!o||o.machine!==m)return err('اختر أمر الشغل');
  if(!canEdit(m))return err('ليس لديك صلاحية');
  const date=$('#f-date').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return err('اختر التاريخ');
  const g=parseNum($('#f-g').value),b=parseNum($('#f-b').value),dg=parseNum($('#f-dg').value),db=parseNum($('#f-db').value);
  if([g,b,dg,db].some(isNaN))return err('الأرقام يجب أن تكون صحيحة وغير سالبة (بدون كسور أو حروف)');
  if(g+b+dg+db===0)return err('أدخل قيمة واحدة على الأقل');
  const old=EDITING?DB.entries.find(e=>e.id===EDITING):null;
  const rec={id:EDITING||uid('e'),order:o.id,m:o.machine,date,g,b,dg,db,note:$('#f-note').value.trim(),by:whoName(),ts:new Date().toISOString()};
  const test=EDITING?DB.entries.map(e=>e.id===EDITING?rec:e):DB.entries.concat(rec);
  const t=totals(o,test);
  if(t.prod>qtyOf(o))return err('إجمالي إنتاج الأمر سيصبح '+fmt(t.prod)+' وهو أكبر من كمية الأمر ('+fmt(qtyOf(o))+' فرخ) — المتبقي المتاح للإنتاج: '+fmt(Math.max(0,qtyOf(o)-(t.prod-g-b)))+' فرخ');
  if(t.sg<0)return err('تسليم السليم ('+fmt(dg)+') أكبر من المتاح بالمخزن ('+fmt(t.sg+dg)+')');
  if(t.sb<0)return err('تسليم المعيب ('+fmt(db)+') أكبر من المتاح بالمخزن ('+fmt(t.sb+db)+')');
  err('');
  /* حماية من أخطاء الإدخال: تحذير يقدر المستخدم يتجاوزه لو متأكد */
  if(!force){
    const warns=[],today=todayStr();
    if(date>today)warns.push('التاريخ ('+fmtDate(date)+') بعد تاريخ اليوم');
    else if(daysBetween(date,today)>45)warns.push('التاريخ ('+fmtDate(date)+') قديم — قبل '+daysBetween(date,today)+' يوم');
    if(DB.entries.some(e=>e.id!==rec.id&&e.order===o.id&&e.date===date&&e.g===g&&e.b===b&&e.dg===dg&&e.db===db))
      warns.push('توجد حركة مطابقة تماماً لهذا الأمر في نفس التاريخ — تأكد أنك لا تسجّلها مرتين');
    const pv=entsOf(o.id).filter(e=>e.id!==rec.id&&(e.g||0)+(e.b||0)>0);
    if(pv.length>=3&&g+b>=20000){
      const avg=sum(pv,e=>(e.g||0)+(e.b||0))/pv.length;
      if(g+b>avg*4)warns.push('إنتاج اليوم ('+fmt(g+b)+') أكبر بكثير من المتوسط المعتاد لهذا الأمر (≈ '+fmt(Math.round(avg))+') — تأكد من عدم وجود صفر زائد');
    }
    if(warns.length){confirmBox(warns,()=>saveEntry(m,true),'متأكد، احفظ');return false}
  }
  DB.entries=test;o.modified=rec.ts;cloudEntry(rec);cloudOrderTouch(o);
  if(old)auditLog('تعديل حركة',MNAME(m)+' · أمر '+o.number+' · '+fmtDate(old.date)+': ['+entSum(old)+'] ← ['+entSum(rec)+']');
  const was=!!EDITING;EDITING=null;LASTDATE=date;SEL[m]=o.id;
  persist();render();toast(was?'تم حفظ التعديل ✓':'تم الحفظ ✓ — رصيد الأمر: '+fmt(t.stock),'ok');
}

  const e=DB.entries.find(x=>x.id===id);if(!e)return;
  const o=DB.orders.find(x=>x.id===e.order);if(!o||!canEdit(o.machine))return;
  EDITING=id;VIEW=o.machine;render();
  const c=$('#entry-card');c&&c.scrollIntoView({behavior:'smooth',block:'center'});
}

function delEntry(id){
  const e=DB.entries.find(x=>x.id===id);if(!e)return;
  const o=DB.orders.find(x=>x.id===e.order);if(!o||!canEdit(o.machine))return;
  const rest=DB.entries.filter(x=>x.id!==id),t=totals(o,rest);
  if(t.sg<0||t.sb<0){toast('لا يمكن الحذف: سيصبح رصيد الأمر بالسالب بسبب تسليمات مسجلة','err');return}
  confirmBox('حذف حركة '+fmtDate(e.date)+' (سليم '+fmt(e.g)+' / معيب '+fmt(e.b)+')؟',()=>{
    DB.entries=rest;o.modified=new Date().toISOString();cloudDelEntry(id);cloudOrderTouch(o);
    auditLog('حذف حركة',MNAME(o.machine)+' · أمر '+o.number+' · '+fmtDate(e.date)+': ['+entSum(e)+']'+(e.by?' · أدخلها '+e.by:''));
    persist();render();
    toastUndo('تم حذف الحركة',()=>undoDelEntry(e));
  },'حذف');
}
function undoDelEntry(e){
  const o=DB.orders.find(x=>x.id===e.order);if(!o||!canEdit(o.machine))return;
  if(DB.entries.some(x=>x.id===e.id))return;
  const test=DB.entries.concat(e),t=totals(o,test);
  if(t.prod>qtyOf(o)||t.sg<0||t.sb<0){toast('تعذر الاسترجاع: الأرصدة تغيّرت بعد الحذف','err');return}
  DB.entries=test;o.modified=new Date().toISOString();cloudEntry(e);cloudOrderTouch(o);
  auditLog('استرجاع حركة محذوفة',MNAME(o.machine)+' · أمر '+o.number+' · '+fmtDate(e.date)+': ['+entSum(e)+']');
  persist();render();toast('تم استرجاع الحركة ✓','ok');
}

function saveOrder(m,id){
  const err=t=>{$('#o-err').textContent=t};
  const denom=$('#o-den').value.trim(),notes=$('#o-notes').value.trim();
  /* رقم الأمر يتحفظ كنص كما هو (أرقام عربية تتحول لإنجليزية) — مش تاريخ */
  const number=normDigits($('#o-num').value).replace(/\s+/g,'').replace(/[\\⁄∕]/g,'/');
  if(!number)return err('اكتب رقم الأمر');
  const o=id?DB.orders.find(x=>x.id===id):null;
  if(!(o&&o.number===number)&&!/^\d+\/\d+$/.test(number))return err('رقم الأمر لازم يكون بالشكل 6029/1 (رقم ثم / ثم رقم)');
  if(DB.orders.some(x=>x.number===number&&x.machine===m&&x.id!==id))return err('رقم الأمر '+number+' موجود بالفعل في هذه الماكينة');
  const qty=parseNum($('#o-qty').value);
  if(isNaN(qty)||qty<1)return err('اكتب كمية الأمر بالفرخ');
  if(qty>MAXQ)return err('كمية الأمر لا يمكن أن تتجاوز '+fmt(MAXQ)+' فرخ');
  let og=o?o.og:0,ob=o?o.ob:0;
  if(isAdmin()){og=parseNum($('#o-og').value);ob=parseNum($('#o-ob').value);if(isNaN(og)||isNaN(ob))return err('الرصيد الافتتاحي رقم صحيح غير سالب')}
  const now=new Date().toISOString();
  if(o){
    const t=totals({...o,og,ob},DB.entries);
    if(t.sg<0||t.sb<0)return err('هذا الرصيد الافتتاحي يجعل رصيد الأمر بالسالب');
    if(t.prod>qty)return err('المنتج فعلياً ('+fmt(t.prod)+') أكبر من الكمية المكتوبة — اكتب كمية لا تقل عن المنتج');
    const chg=[];
    if(o.number!==number)chg.push('الرقم '+o.number+' ← '+number);
    if((o.denom||'')!==denom)chg.push('الفئة «'+(o.denom||'—')+'» ← «'+(denom||'—')+'»');
    if(qtyOf(o)!==qty)chg.push('الكمية '+fmt(qtyOf(o))+' ← '+fmt(qty));
    if((o.og||0)!==og)chg.push('افتتاحي سليم '+fmt(o.og)+' ← '+fmt(og));
    if((o.ob||0)!==ob)chg.push('افتتاحي معيب '+fmt(o.ob)+' ← '+fmt(ob));
    if((o.notes||'')!==notes)chg.push('الملاحظات');
    const oldNo=o.number;
    Object.assign(o,{number,denom,notes,og,ob,qty,modified:now});cloudOrder(o);
    if(chg.length)auditLog('تعديل أمر',MNAME(m)+' · '+oldNo+': '+chg.join(' · '));
  }else{
    const n={id:uid('o'),machine:m,number,denom,notes,og,ob,qty,modified:now};
    DB.orders.push(n);SEL[m]=n.id;cloudOrder(n);
    auditLog('أمر جديد',MNAME(m)+' · '+number+(denom?' · '+denom:'')+' · كمية '+fmt(qty));
  }
  persist();closeModal();render();toast('تم حفظ الأمر ✓','ok');
}

/*IMPORT_START*/
const XL_MACHINE=/^\s*ترقيم\s*([1-4])\s*$/;
const XL_ORDER_OK=/^\d+\/\d+$/;
let IMPORT_ROWS=[],IMPORT_SEL=new Set();

/* تاريخ Excel (رقم تسلسلي) ← كائن Date بتوقيت UTC بدون أي إزاحة */
function xlDate(v){
  const n=Number(v);if(!isFinite(n))return null;
  const d=new Date(Date.UTC(1899,11,30)+Math.round(n*86400)*1000);
  return isNaN(d.getTime())?null:d;
}
function xlIso(v){
  const d=xlDate(v);if(!d)return null;
  return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())+':'+pad(d.getUTCSeconds());
}
const hasV=c=>!!c&&c.v!=null&&String(c.v).trim()!=='';
function xlText(c){
  if(!c||c.v==null)return '';
  return (c.t==='s'?String(c.v):(c.w!=null?String(c.w):String(c.v))).replace(/\s+/g,' ').trim();
}
/* رقم الأمر: Excel بيحوّل 6029/1 لتاريخ (سنة 6029 شهر 1) — بنرجّعه لشكله الأصلي */
function xlOrderNo(X,c){
  if(!hasV(c))return {n:'',w:''};
  if(c.t==='n'){
    if(c.z&&X.SSF.is_date(c.z)){
      const d=xlDate(c.v);
      if(d)return {n:d.getUTCFullYear()+'/'+(d.getUTCMonth()+1),w:d.getUTCDate()!==1?'تم تجاهل اليوم من رقم الأمر':''};
    }
    return {n:String(c.v),w:''};
  }
  const t=normDigits(String(c.v)).replace(/[\\⁄∕]/g,'/').trim(),k=t.replace(/\s+/g,'');
  return {n:XL_ORDER_OK.test(k)?k:t,w:''};
}
/* كمية: رقم صحيح غير سالب، أو نص بفواصل/أرقام عربية — NaN لو غير صالح */
function xlNum(c){
  if(!hasV(c))return 0;
  if(c.t==='n')return Number.isInteger(c.v)&&c.v>=0?c.v:NaN;
  return parseNum(c.v);
}
function xlModified(c){
  if(!hasV(c))return null;
  if(c.t==='n')return xlIso(c.v);
  const d=new Date(c.v);
  return isNaN(d.getTime())?null:ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}

/* قراءة كل الشيتات: اسم الماكينة من خلية «ترقيم ١..٤» (تفضل سارية لحد ما يظهر اسم جديد، فتشتغل مع الخلايا المدموجة) */
function parseExcelRows(X,wb){
  const rows=[];
  for(const sn of wb.SheetNames){
    const ws=wb.Sheets[sn];if(!ws||!ws['!ref'])continue;
    const rg=X.utils.decode_range(ws['!ref']);
    const at=(r,c)=>ws[X.utils.encode_cell({r:r,c:c})];
    let col={num:1,denom:2,g:3,b:4,notes:5,mod:6},machine=null;
    const sm=XL_MACHINE.exec(normDigits(sn));if(sm)machine=Number(sm[1]);
    for(let r=rg.s.r;r<=rg.e.r;r++){
      /* صف العناوين: يحدد مكان الأعمدة */
      const heads={};
      for(let c=rg.s.c;c<=rg.e.c;c++){
        const t=normDigits(xlText(at(r,c)));
        if(/^رقم\s*ال[أإا]مر$/.test(t))heads.num=c;
        else if(/^الفئ[ةه]$/.test(t))heads.denom=c;
        else if(t==='سليم')heads.g=c;
        else if(t==='معيب')heads.b=c;
        else if(/^ملاحظات?$/.test(t))heads.notes=c;
        else if(/^تاريخ/.test(t))heads.mod=c;
      }
      if(heads.num!=null&&heads.g!=null&&heads.b!=null){col=Object.assign({},col,heads);continue}
      for(let c=rg.s.c;c<col.num;c++){
        const m=XL_MACHINE.exec(normDigits(xlText(at(r,c))));if(m)machine=Number(m[1]);
      }
      const nc=xlOrderNo(X,at(r,col.num)),denom=normDigits(xlText(at(r,col.denom))),notes=xlText(at(r,col.notes));
      const gc=at(r,col.g),bc=at(r,col.b);
      if(!nc.n&&!denom&&!notes&&!hasV(gc)&&!hasV(bc))continue;
      const g=xlNum(gc),b=xlNum(bc);
      const x={sheet:sn,row:r+1,machine:machine,number:nc.n||'بدون رقم',denom:denom,g:isNaN(g)?0:g,b:isNaN(b)?0:b,notes:notes,mod:xlModified(at(r,col.mod)),warns:[],err:''};
      if(nc.w)x.warns.push(nc.w);
      if(machine==null)x.err='لم أجد اسم الماكينة (ترقيم ١–٤) فوق هذا الصف';
      else if(isNaN(g)||isNaN(b))x.err='قيمة غير صالحة في السليم أو المعيب (لازم رقم صحيح بدون كسور)';
      rows.push(x);
    }
  }
  return rows;
}

/* مقارنة الملف بالبيانات الحالية. أرقام الملف = الرصيد الحالي، فلو الأمر عليه حركات
   مسجلة بنعدّل الرصيد الافتتاحي بحيث الرصيد النهائي يطابق الملف تماماً (بدون عدّ مرتين) */
function buildImportPlan(rows){
  const seen=new Set(),plan=[];
  for(const x of rows){
    const key=x.machine+'|'+x.number;
    const p=Object.assign({},x,{key:key,status:'new',cur:null,og:x.g,ob:x.b,oid:null,warns:x.warns.slice()});
    plan.push(p);
    if(x.err){p.status='err';continue}
    if(seen.has(key)){p.status='err';p.err='رقم الأمر مكرر في نفس الماكينة داخل الملف';continue}
    seen.add(key);
    if(x.number!=='بدون رقم'){
      if(!XL_ORDER_OK.test(x.number))p.warns.push('رقم الأمر بصيغة غير معتادة');
      const ms=new Set();
      DB.orders.forEach(z=>{if(z.number===x.number&&z.machine!==x.machine)ms.add(z.machine)});
      rows.forEach(z=>{if(z.number===x.number&&z.machine&&z.machine!==x.machine)ms.add(z.machine)});
      if(ms.size)p.warns.push('نفس الرقم موجود أيضاً في '+[...ms].sort().map(MNAME).join(' و'));
    }
    const o=DB.orders.find(z=>z.machine===x.machine&&z.number===x.number);
    if(!o){
      if(x.g+x.b>MAXQ){p.status='err';p.err='الرصيد أكبر من الحد الأقصى للأمر ('+fmt(MAXQ)+' فرخ)'}
      continue;
    }
    p.status='upd';p.oid=o.id;
    const ents=DB.entries.filter(e=>e.order===o.id),t0=totals(o,DB.entries);
    p.cur={sg:t0.sg,sb:t0.sb};
    p.og=x.g-sum(ents,e=>e.g-e.dg);p.ob=x.b-sum(ents,e=>e.b-e.db);
    if(p.og<0||p.ob<0){p.status='err';p.err='التسليمات المسجلة على هذا الأمر أكبر من الرصيد في الملف';continue}
    if(p.og+p.ob+sum(ents,e=>e.g+e.b)>qtyOf(o)){p.status='err';p.err='إجمالي الإنتاج هيتخطى كمية الأمر المسجلة ('+fmt(qtyOf(o))+' فرخ)';continue}
    if(p.og===o.og&&p.ob===o.ob&&(!x.denom||x.denom===o.denom)&&(!x.notes||x.notes===o.notes))p.status='same';
  }
  return plan;
}
function applyImport(){
  if(!isAdmin())return;
  const plan=buildImportPlan(IMPORT_ROWS),now=new Date().toISOString(),up={};
  if(IMPORT_SEL.size)saveRestorePoint('قبل استيراد Excel');
  let nn=0,nu=0;
  for(const p of plan){
    if(!IMPORT_SEL.has(p.key)||(p.status!=='new'&&p.status!=='upd'))continue;
    let o;
    if(p.status==='upd'){
      o=DB.orders.find(z=>z.id===p.oid);if(!o)continue;
      o.og=p.og;o.ob=p.ob;if(p.denom)o.denom=p.denom;if(p.notes)o.notes=p.notes;o.modified=p.mod||now;nu++;
    }else{
      o={id:uid('o'),machine:p.machine,number:p.number,denom:p.denom,notes:p.notes,og:p.g,ob:p.b,qty:MAXQ,modified:p.mod||now};
      DB.orders.push(o);nn++;
    }
    up['orders/'+o.id]=plain(o);
  }
  if(!nn&&!nu){toast('لا يوجد ما يُستورد','err');return}
  if(CLOUD&&FB)cw(()=>FB.update(FB.ref(FB.db),up));
  auditLog('استيراد Excel',nn+' أمر جديد · '+nu+' أمر محدّث');
  persist();closeModal();render();
  toast('تم الاستيراد ✓ — '+nn+' أمر جديد · '+nu+' أمر محدّث','ok');
}

let XL_P=null;
function loadXLSX(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  if(XL_P)return XL_P;
  const urls=['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'];
  XL_P=urls.reduce((p,u)=>p.catch(()=>new Promise((res,rej)=>{
    const s=document.createElement('script');s.src=u;
    s.onload=()=>window.XLSX?res(window.XLSX):rej();s.onerror=()=>rej();document.head.appendChild(s);
  })),Promise.reject()).catch(e=>{XL_P=null;throw e});
  return XL_P;
}

/* ============== أدوات التاريخ والإحصاء ============== */
function addDays(s,n){const p=String(s).split('-');return ymd(new Date(+p[0],+p[1]-1,+p[2]+n))}
function daysBetween(a,b){const p=s=>{const x=String(s).split('-');return Date.UTC(+x[0],+x[1]-1,+x[2])};return Math.round((p(b)-p(a))/864e5)}
const WD=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function dayName(s){const p=String(s).split('-');return WD[new Date(+p[0],+p[1]-1,+p[2]).getDay()]}
/* مجموع الإنتاج والتسليمات لكل ماكينة في فترة (تواريخ نصية YYYY-MM-DD) — مرور واحد على الحركات */
function statsBy(from,to){
  const OM=orderMachineMap(),r={};
  MACHINES.forEach(m=>r[m]={g:0,b:0,dg:0,db:0,n:0});
  for(const e of DB.entries){
    if(e.date<from||e.date>to)continue;
    const m=OM[e.order];if(!m)continue;
    const x=r[m];x.g+=e.g||0;x.b+=e.b||0;x.dg+=e.dg||0;x.db+=e.db||0;x.n++;
  }
  return r;
}
function lastActivity(o){
  let d=String(o.modified||'').slice(0,10);
  for(const e of entsOf(o.id))if(e.date>d)d=e.date;
  return d;
}

/* ============== توقع اكتمال الأمر ============== */
function forecast(o){
  const t=totals(o,DB.entries),rem=qtyOf(o)-t.prod;
  if(rem<=0)return {done:true};
  const today=todayStr(),from=addDays(today,-13);
  let p=0;for(const e of entsOf(o.id))if(e.date>=from&&e.date<=today)p+=(e.g||0)+(e.b||0);
  if(!p)return null;
  const rate=p/14,days=Math.ceil(rem/rate);
  return {rate,days,date:addDays(today,Math.min(days,3650))};
}
function fcHTML(o){
  const f=forecast(o);
  if(!f)return '';
  if(f.done)return '<div class="fc">🏁 <b>اكتملت كمية الأمر</b></div>';
  return '<div class="fc">⏳ متوقع الاكتمال '+(f.days>365?'<b>بعد أكثر من سنة</b>':'بعد <b>≈ '+fmt(f.days)+' يوم</b> ('+fmtDate(f.date)+')')+' · المعدل '+fmt(Math.round(f.rate))+' فرخ/يوم</div>';
}

/* ============== التنبيهات الذكية ============== */
function buildAlerts(){
  const out=[],today=todayStr(),st=statsBy(addDays(today,-6),today),st1=statsBy(today,today);
  const now=new Date(),hr=now.getHours(),notFri=now.getDay()!==5;
  for(const m of MACHINES){
    const s=st[m],prod=s.g+s.b;
    if(prod>=5000){
      const d=s.b/prod*100;
      if(d>=DEFECT_WARN)out.push({lvl:d>=DEFECT_WARN*1.5?'hi':'md',m,ic:'⚠️',txt:MNAME(m)+': نسبة المعيب آخر 7 أيام '+d.toFixed(1)+'% (الحد المقبول '+DEFECT_WARN+'%)'});
    }
    if(hr>=15&&notFri&&ordersOf(m).length&&!st1[m].n)
      out.push({lvl:'lo',m,ic:'📝',txt:MNAME(m)+': لم تُسجَّل أي حركة اليوم حتى الآن'});
  }
  for(const o of DB.orders){
    const t=totals(o,DB.entries),q=qtyOf(o),la=lastActivity(o),idle=la?daysBetween(la,today):0;
    if(t.prod>=q){
      if(idle<=7)out.push({lvl:'lo',m:o.machine,ic:'🏁',txt:MNAME(o.machine)+' · الأمر '+o.number+': اكتملت كمية الأمر ('+fmt(q)+' فرخ)'});
    }else if(t.prod/q>=NEAR_DONE){
      out.push({lvl:'md',m:o.machine,ic:'📈',txt:MNAME(o.machine)+' · الأمر '+o.number+': قارب على الاكتمال ('+Math.round(t.prod/q*100)+'%) — متبقي '+fmt(q-t.prod)+' فرخ، جهّز الأمر التالي'});
    }
    if(t.stock>0&&idle>=IDLE_DAYS)
      out.push({lvl:'lo',m:o.machine,ic:'🕸️',txt:MNAME(o.machine)+' · الأمر '+o.number+': رصيد راكد '+fmt(t.stock)+' فرخ — بدون حركة منذ '+idle+' يوم'});
  }
  const rank={hi:0,md:1,lo:2};
  return out.sort((a,b)=>rank[a.lvl]-rank[b.lvl]);
}

    if(LOGF.to&&e.date>LOGF.to)return false;
    if(q&&!(o.number+' '+o.denom+' '+(e.note||'')+' '+(e.by||'')).toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>cmpDT(b,a));
  if(!ents.length)return '<div class="empty">لا توجد حركات تطابق البحث</div><div class="actions"><button class="btn light sm" onclick="logClear()">مسح الفلاتر</button></div>';
  const shown=SHOWALL?ents:ents.slice(0,40);
  const bal={},need=new Set(shown.map(e=>e.order));os.forEach(o=>{if(need.has(o.id))Object.assign(bal,runningBalances(o))});
  let h='<div class="muted" style="margin:0 0 8px">'+ents.length+' حركة'+(active?' من '+all.length+' · سليم '+fmt(sum(ents,e=>e.g||0))+' · معيب '+fmt(sum(ents,e=>e.b||0))+' · تسليمات '+fmt(sum(ents,e=>(e.dg||0)+(e.db||0)))+' <button class="btn light sm" onclick="logClear()">مسح الفلاتر</button>':'')+'</div>';
  h+='<div class="tw"><table><thead><tr><th>التاريخ</th><th>الأمر</th><th>سليم</th><th>معيب</th><th>إنتاج اليوم</th><th>تسليم سليم</th><th>تسليم معيب</th><th>رصيد السليم</th><th>رصيد المعيب</th><th>الرصيد الكلي</th>'+(ce?'<th></th>':'')+'</tr></thead><tbody>';
  for(const e of shown){
    const o=oMap[e.order],b=bal[e.id]||{sg:0,sb:0};
    h+='<tr><td>'+fmtDate(e.date)+'<small>'+esc(e.by||'')+'</small></td>'+
      '<td class="l"><b class="ltr">'+esc(o.number)+'</b><small>'+esc(o.denom)+(e.note?' · '+esc(e.note):'')+'</small></td>'+
      '<td class="g"><b>'+fmt(e.g)+'</b></td><td class="b"><b>'+fmt(e.b)+'</b></td><td><b>'+fmt(e.g+e.b)+'</b></td>'+
      '<td>'+fmt(e.dg)+'</td><td>'+fmt(e.db)+'</td>'+
      '<td class="g">'+fmt(b.sg)+'</td><td class="b">'+fmt(b.sb)+'</td><td><b>'+fmt(b.sg+b.sb)+'</b></td>'+
      (ce?'<td><button class="btn light sm" onclick="editEntry(\''+e.id+'\')">تعديل</button> <button class="btn danger sm" onclick="delEntry(\''+e.id+'\')">حذف</button></td>':'')+'</tr>';
  }
  h+='</tbody></table></div>';
  if(ents.length>40)h+='<div class="actions"><button class="btn light sm" onclick="SHOWALL='+(!SHOWALL)+';logRefresh()">'+(SHOWALL?'عرض آخر 40 فقط':'عرض كل الحركات ('+ents.length+')')+'</button></div>';
  return h;
}

/* ============== سجل التدقيق ============== */
let AUDIT=[];
function auditLog(act,txt){
  const rec={id:uid('a'),ts:new Date().toISOString(),by:whoName()||'—',act,txt};
  if(CLOUD){
    /* كتابة صامتة: لو قواعد Firebase مش بتسمح بالعقدة audit ما نزعجش المستخدم */
    if(FB){try{const p=FB.set(FB.ref(FB.db,'audit/'+rec.id),rec);if(p&&p.catch)p.catch(()=>{})}catch(e){}}
  }else{
    (DB.audit=DB.audit||[]).push(rec);
    if(DB.audit.length>500)DB.audit.splice(0,DB.audit.length-500);
    persist();
  }
}
function auditListen(){
  if(!CLOUD||!FB||!isAdmin()||FB.auditOn)return;
  FB.auditOn=true;
  try{
    FB.auditOff=FB.onValue(FB.query(FB.ref(FB.db,'audit'),FB.limitToLast(200)),
      s=>{AUDIT=toArr(s).sort((a,b)=>String(b.ts).localeCompare(String(a.ts)));if(VIEW==='settings')sched()},
      ()=>{AUDIT=null;if(VIEW==='settings')sched()});
  }catch(e){FB.auditOn=false}
}
function auditStop(){
  if(FB){if(FB.auditOff){try{FB.auditOff()}catch(e){}}FB.auditOn=false;FB.auditOff=null}
  AUDIT=[];
}
function auditHTML(){
  const list=CLOUD?AUDIT:(DB.audit||[]).slice().reverse();
  let h='<div class="card sec"><h3>📜 سجل التدقيق</h3><div class="muted" style="margin-bottom:10px">كل تعديل أو حذف للحركات وأوامر الشغل وعمليات الإدارة: من قام بها ومتى.</div>';
  if(list==null)h+='<div class="empty">لا تتوفر صلاحية قراءة سجل التدقيق من Firebase — أضف قاعدة قراءة وكتابة للعقدة <b class="ltr">audit</b> للمدير.</div>';
  else if(!list.length)h+='<div class="empty">لا توجد عمليات مسجلة بعد</div>';
  else h+='<div class="tw" style="max-height:340px"><table style="min-width:640px"><thead><tr><th>الوقت</th><th>المستخدم</th><th>العملية</th><th>التفاصيل</th></tr></thead><tbody>'+
    list.slice(0,100).map(a=>'<tr><td>'+esc(fmtTime(a.ts))+'</td><td>'+esc(a.by)+'</td><td><b>'+esc(a.act)+'</b></td><td class="l">'+esc(a.txt)+'</td></tr>').join('')+'</tbody></table></div>';
  return h+'</div>';
}

/* ============== نقطة الاسترجاع ============== */
const RP_KEY='tarqeem_restore_v1';
function saveRestorePoint(label){
  try{
    const s={ts:new Date().toISOString(),label,orders:DB.orders,entries:DB.entries};
    if(!CLOUD){s.users=DB.users;s.audit=DB.audit||[]}
    localStorage.setItem(RP_KEY,JSON.stringify(s));
  }catch(e){}
}
function getRestorePoint(){
  try{const s=JSON.parse(localStorage.getItem(RP_KEY));if(s&&Array.isArray(s.orders)&&Array.isArray(s.entries))return s}catch(e){}
  return null;
}
function restoreLast(){
  const r=getRestorePoint();if(!r||!isAdmin())return;
  confirmBox('استرجاع نسخة «'+r.label+'» ('+fmtTime(r.ts)+')؟ سيتم استبدال البيانات الحالية (وتُحفظ نسخة منها قبل ذلك).',()=>{
    saveRestorePoint('قبل الاسترجاع');
    applyDataset({orders:r.orders,entries:r.entries,users:r.users,audit:r.audit});
    auditLog('استرجاع نسخة','«'+r.label+'» بتاريخ '+fmtTime(r.ts));
    toast('تم الاسترجاع ✓','ok');
  },'استرجاع');
}
function restoreHTML(){
  const r=getRestorePoint();
  return '<div class="card sec"><h3>↩️ نقطة الاسترجاع</h3><div class="muted" style="margin-bottom:10px;line-height:1.9">قبل أي عملية كبيرة (استبدال، دمج، استيراد Excel، إعادة ضبط، حذف أمر) يحفظ البرنامج نسخة تلقائية على هذا الجهاز، وتقدر ترجع لها.</div>'+
   (r?'<div class="actions" style="margin-top:0"><span class="chip-user" style="background:#eef2ff;color:#3730a3">'+esc(r.label)+' · '+esc(fmtTime(r.ts))+' · '+r.orders.length+' أمر / '+r.entries.length+' حركة</span><button class="btn light" onclick="restoreLast()">↩️ استرجاع هذه النسخة</button></div>':'<div class="muted">لا توجد نقطة استرجاع محفوظة بعد.</div>')+'</div>';
}

/* ============== التقارير (واتساب / طباعة) ============== */
function reportData(from,to){
  const st=statsBy(from,to);
  const rows=MACHINES.map(m=>{
    const s=st[m];let sg=0,sb=0;
    for(const o of ordersOf(m)){
      sg+=o.og||0;sb+=o.ob||0;
      for(const e of entsOf(o.id))if(e.date<=to){sg+=(e.g||0)-(e.dg||0);sb+=(e.b||0)-(e.db||0)}
    }
    const prod=s.g+s.b;
    return {m,g:s.g,b:s.b,prod,del:s.dg+s.db,sg,sb,stock:sg+sb,def:prod?s.b/prod*100:0};
  });
  const tot={g:0,b:0,prod:0,del:0,sg:0,sb:0,stock:0};
  rows.forEach(r=>{for(const k in tot)tot[k]+=r[k]});
  tot.def=tot.prod?tot.b/tot.prod*100:0;
  return {rows,tot};
}
function reportText(from,to,d){
  const label=from===to?dayName(from)+' '+fmtDate(from):'من '+fmtDate(from)+' إلى '+fmtDate(to);
  const L=['📦 *تقرير مخزن الترقيمات*','📅 '+label,'━━━━━━━━━━━━'];
  d.rows.forEach(r=>{
    L.push('🏭 *'+MNAME(r.m)+'*');
    L.push('• الإنتاج: '+fmt(r.prod)+' (سليم '+fmt(r.g)+' · معيب '+fmt(r.b)+(r.prod?' — '+r.def.toFixed(1)+'%':'')+')');
    L.push('• التسليمات: '+fmt(r.del));
    L.push('• رصيد المخزن: '+fmt(r.stock)+' (سليم '+fmt(r.sg)+' · معيب '+fmt(r.sb)+')');
    L.push('');
  });
  L.push('━━━━━━━━━━━━','📊 *الإجمالي*');
  L.push('• الإنتاج: '+fmt(d.tot.prod)+' (معيب '+d.tot.def.toFixed(1)+'%)');
  L.push('• التسليمات: '+fmt(d.tot.del));
  L.push('• رصيد المخزن: '+fmt(d.tot.stock)+' (سليم '+fmt(d.tot.sg)+' · معيب '+fmt(d.tot.sb)+')');
  return L.join('\n');
}
let REP=null;
function reportModal(){
  const t=todayStr();
  openModal('<h3>📋 تقرير الإنتاج والمخزون</h3>'+
   '<div class="seg noprint" style="margin-bottom:10px;flex-wrap:wrap"><button onclick="repPreset(0)">اليوم</button><button onclick="repPreset(1)">أمس</button><button onclick="repPreset(7)">آخر 7 أيام</button><button onclick="repPreset(30)">آخر 30 يوم</button></div>'+
   '<div class="fgrid noprint" style="margin-bottom:12px"><label class="f">من<input type="date" id="rp-f" onchange="repChange()"></label><label class="f">إلى<input type="date" id="rp-t" onchange="repChange()"></label></div>'+
   '<div id="rep-body"></div>'+
   '<div class="actions noprint"><button class="btn primary" onclick="repCopy()">📋 نسخ النص</button><button class="btn green" onclick="repWA()">💬 إرسال واتساب</button><button class="btn light" onclick="repPrint()">🖨️ طباعة</button><button class="btn light" onclick="closeModal()">إغلاق</button></div>',true);
  $('#rp-f').value=t;$('#rp-t').value=t;repChange();
  const md=$('#modal-root .modal');if(md){md.setAttribute('tabindex','-1');md.focus({preventScroll:true})}
}
function repPreset(n){
  const t=todayStr();
  $('#rp-f').value=n===0?t:n===1?addDays(t,-1):addDays(t,-(n-1));
  $('#rp-t').value=n===1?addDays(t,-1):t;
  repChange();
}
function repChange(){
  let f=$('#rp-f').value,t=$('#rp-t').value;
  if(!f||!t)return;
  if(f>t){const x=f;f=t;t=x}
  const d=reportData(f,t);
  REP={from:f,to:t,text:reportText(f,t,d)};
  const row=(r,cls)=>'<tr'+(cls?' class="'+cls+'"':'')+'><td class="l"><b>'+(r.m?MNAME(r.m):'الإجمالي')+'</b></td><td class="g">'+fmt(r.g)+'</td><td class="b">'+fmt(r.b)+'</td><td><b>'+fmt(r.prod)+'</b></td><td>'+r.def.toFixed(1)+'%</td><td>'+fmt(r.del)+'</td><td><b>'+fmt(r.stock)+'</b><small>سليم '+fmt(r.sg)+' · معيب '+fmt(r.sb)+'</small></td></tr>';
  $('#rep-body').innerHTML='<div class="muted" style="margin-bottom:8px">'+(f===t?'📅 '+dayName(f)+' '+fmtDate(f):'📅 من '+fmtDate(f)+' إلى '+fmtDate(t))+' — الأرصدة كما هي في نهاية الفترة</div>'+
   '<div class="tw"><table style="min-width:620px"><thead><tr><th>الماكينة</th><th>سليم</th><th>معيب</th><th>الإنتاج</th><th>% معيب</th><th>التسليمات</th><th>رصيد المخزن</th></tr></thead><tbody>'+d.rows.map(r=>row(r)).join('')+row(d.tot,'tot')+'</tbody></table></div>';
}
function fallbackCopy(t,done){
  const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();
  try{document.execCommand('copy');done()}catch(e){toast('تعذر النسخ','err')}
  a.remove();
}
function repCopy(){
  const t=REP&&REP.text;if(!t)return;
  const done=()=>toast('تم نسخ التقرير ✓','ok');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done));
  else fallbackCopy(t,done);
}
function repWA(){if(REP&&REP.text)window.open('https://wa.me/?text='+encodeURIComponent(REP.text),'_blank','noopener')}
function repPrint(){document.body.classList.add('pr');try{window.print()}finally{setTimeout(()=>document.body.classList.remove('pr'),400)}}

/* ============== تصدير Excel حقيقي (.xlsx) بعدة أوراق ============== */
function exportXLSX(){
  toast('جاري تجهيز ملف Excel…');
  loadXLSX().then(X=>{
    const OM={};DB.orders.forEach(o=>OM[o.id]=o);
    const ords=[...DB.orders].sort((a,b)=>a.machine-b.machine||String(a.number).localeCompare(String(b.number)));
    const bal=[['الماكينة','رقم الأمر','الفئة','كمية الأمر','إجمالي الإنتاج','إجمالي التسليمات','رصيد السليم','رصيد المعيب','إجمالي المخزن','% المنتج من الكمية','آخر تعديل','ملاحظات']];
    ords.forEach(o=>{const t=totals(o,DB.entries),q=qtyOf(o);bal.push([MNAME(o.machine),o.number,o.denom,q,t.prod,t.del,t.sg,t.sb,t.stock,Math.round(t.prod/q*1000)/10,fmtTime(o.modified),o.notes||''])});
    const sorted=[...DB.entries].sort((a,b)=>a.date.localeCompare(b.date)||String(a.ts).localeCompare(String(b.ts)));
    const log=[['التاريخ','الماكينة','رقم الأمر','الفئة','سليم','معيب','إنتاج اليوم','تسليم سليم','تسليم معيب','ملاحظة','أدخله','وقت الإدخال']];
    const day={};
    sorted.forEach(e=>{
      const o=OM[e.order];if(!o)return;
      log.push([e.date,MNAME(o.machine),o.number,o.denom,e.g||0,e.b||0,(e.g||0)+(e.b||0),e.dg||0,e.db||0,e.note||'',e.by||'',fmtTime(e.ts)]);
      const k=e.date+'|'+o.machine,x=day[k]||(day[k]={d:e.date,m:o.machine,g:0,b:0,del:0});
      x.g+=e.g||0;x.b+=e.b||0;x.del+=(e.dg||0)+(e.db||0);
    });
    const sum1=[['التاريخ','الماكينة','إنتاج سليم','إنتاج معيب','إجمالي الإنتاج','% معيب','تسليمات']];
    Object.values(day).sort((a,b)=>a.d.localeCompare(b.d)||a.m-b.m).forEach(x=>sum1.push([x.d,MNAME(x.m),x.g,x.b,x.g+x.b,(x.g+x.b)?Math.round(x.b/(x.g+x.b)*1000)/10:0,x.del]));
    const wb=X.utils.book_new();
    [['الأرصدة',bal,[11,13,14,12,14,15,12,12,13,16,18,40]],['السجل',log,[12,11,13,14,10,10,12,12,12,30,14,18]],['ملخص يومي',sum1,[12,11,12,12,14,10,12]]].forEach(s=>{
      const ws=X.utils.aoa_to_sheet(s[1]);ws['!cols']=s[2].map(w=>({wch:w}));X.utils.book_append_sheet(wb,ws,s[0]);
    });
    wb.Workbook={Views:[{RTL:true}]};
    X.writeFile(wb,'tarqeem-'+todayStr()+'.xlsx');
    toast('تم تنزيل ملف Excel ✓','ok');
  }).catch(e=>{if(e)console.error(e);toast('تعذر إنشاء ملف Excel (يحتاج إنترنت أول مرة) — تم تنزيل CSV بدلاً منه','err');exportCSV()});
}
